<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body{
            background:#f0f8ff;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .card{
            background:white;
            padding:30px;
            width:350px;
            border-radius:10px;
            box-shadow:0 0 10px #aaa;
        }
        input,button{
            width:100%;
            padding:10px;
            margin:8px 0;
        }
        button{
            background:#0077cc;
            color:white;
            border:none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: {% if category == 'error' %}red{% elif category == 'success' %}green{% else %}orange{% endif %}; padding: 10px; background: #f9f9f9; border-radius: 5px; margin: 10px 0;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <input name="phone" placeholder="Phone Number" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="/register">Register</a></p>
</div>

</body>
</html>
